<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Desmos embed test</title></head>
<body>
<div id="calc" style="width:600px;height:320px;border:1px solid #ccc;background:#fff"></div>
<script>
  window.__errors = [];
  window.addEventListener('error', function (e) { window.__errors.push('page-error: ' + e.message); });
  var s = document.createElement('script');
  s.src = 'https://www.desmos.com/api/v1.10/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6';
  s.onload = function () {
    var tag = ['R', 'ES', 'ULT', '-OK'].join('');
    var failTag = ['R', 'ES', 'ULT', '-FAIL'].join('');
    var box = document.getElementById('calc');
    try {
      var c = Desmos.GraphingCalculator(box, { keypad: true, expressions: true });
      setTimeout(function () {
        var ifr = box.querySelector('iframe');
        var kids = box.childNodes.length;
        var htmlLen = (box.innerHTML || '').length;
        document.title = tag + ' iframe=' + !!ifr + ' children=' + kids + ' htmlLen=' + htmlLen + ' h=' + box.offsetHeight;
      }, 4500);
    } catch (e) { document.title = failTag + ' init=' + e.message; }
  };
  s.onerror = function () { document.title = ['R', 'ES', 'ULT', '-FAIL'].join('') + ' script-load-failed'; };
  s.onerror = function () { window.__errors.push('script-load-failed'); };
  document.head.appendChild(s);
</script>
</body>
</html>
