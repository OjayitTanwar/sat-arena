<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desmos app probe</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { background: var(--bg); padding: 24px; }
  .probe-note { font-family: var(--font); font-size: 13px; color: var(--muted); margin-bottom: 12px; }
</style>
</head>
<body>
<div class="probe-note">Probe: replicating #view-practice question card + calculator panel (app CSS).</div>
<div class="card" style="max-width: 560px; margin: 0 auto;">
  <div class="q-text">If 3x + 2 = 17, what is the value of x?</div>
  <div class="calc-panel" id="calc-panel">
    <div class="calc-embed" id="calc-embed"></div>
  </div>
</div>
<script>
  var s = document.createElement('script');
  s.src = 'https://www.desmos.com/api/v1.10/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6';
  s.onload = function () {
    try {
      var c = Desmos.GraphingCalculator(document.getElementById('calc-embed'), {
        keypad: true, expressions: true, settingsMenu: true, zoomButtons: true, border: false,
      });
      document.title = 'PROBE-OK';
    } catch (e) { document.title = 'PROBE-FAIL ' + e.message; }
  };
  s.onerror = function () { document.title = 'PROBE-SCRIPT-FAIL'; };
  document.head.appendChild(s);
</script>
</body>
</html>
